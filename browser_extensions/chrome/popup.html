<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SentinelGuard</title>
  <style>
    body { width: 300px; font-family: "Segoe UI", sans-serif; background: #11151c; color: #e6e9ef; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .domain { font-size: 12px; color: #9aa4b2; word-break: break-all; margin-bottom: 8px; }
    .risk { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .reason { font-size: 12px; color: #9aa4b2; margin-bottom: 12px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button { background: #1a212c; color: #e6e9ef; border: 1px solid #232c3a; border-radius: 6px; padding: 8px; font-size: 12px; cursor: pointer; }
    button:hover { background: #232c3a; }
    button.danger { border-color: #e5484d; color: #e5484d; }
    button.safe { border-color: #4fd1a5; color: #4fd1a5; }
    #status { font-size: 11px; color: #9aa4b2; margin-top: 10px; min-height: 14px; }
  </style>
</head>
<body>
  <h1>SentinelGuard</h1>
  <div class="domain" id="domain">Loading…</div>
  <div class="risk" id="risk">—</div>
  <div class="reason" id="reason"></div>
  <div class="buttons">
    <button class="safe" id="allowOnce">Allow Once</button>
    <button class="danger" id="block">Block</button>
    <button class="safe" id="alwaysAllow">Always Allow</button>
    <button class="danger" id="alwaysBlock">Always Block</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
