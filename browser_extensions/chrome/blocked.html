<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Blocked — SentinelGuard</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #11151c; color: #e6e9ef; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { max-width: 480px; text-align: center; padding: 32px; background: #1a212c; border: 1px solid #232c3a; border-radius: 12px; }
    h1 { color: #e5484d; font-size: 20px; }
    .url { word-break: break-all; color: #9aa4b2; font-size: 12px; margin: 12px 0; }
    .risk { font-size: 14px; margin-bottom: 20px; }
    .reason { color: #9aa4b2; font-size: 13px; margin-bottom: 24px; }
    .buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button { background: #232c3a; color: #e6e9ef; border: 1px solid #2f3948; border-radius: 6px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
    button:hover { background: #2f3948; }
    button.safe { border-color: #4fd1a5; color: #4fd1a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⛔ Blocked by SentinelGuard</h1>
    <div class="url" id="url"></div>
    <div class="risk" id="risk"></div>
    <div class="reason" id="reason"></div>
    <div class="buttons">
      <button id="back">Go Back</button>
      <button class="safe" id="allowOnce">Allow Once</button>
      <button class="safe" id="alwaysAllow">Always Allow</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
