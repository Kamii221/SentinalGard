name: Build Windows installer

# Builds the PyInstaller bundle (sentinelguard.spec) and wraps it in an
# Inno Setup installer (installer/sentinelguard.iss). Both steps need
# real Windows -- Inno Setup's compiler is a Windows-only tool, and this
# is also the only place the pywin32-backed code (persistence/event-log
# monitoring) actually gets imported and byte-compiled for real, since
# pywin32 isn't installed at all on the Linux dev environment this repo
# is otherwise developed and tested in.
#
# Trigger manually from the Actions tab (Run workflow), or push a tag
# like "v1.2.3" to build and version a release installer.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: pytest tests/ -q

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the PyInstaller bundle
        run: pyinstaller sentinelguard.spec

      - name: Smoke test the packaged executable
        # Actually launches the compiled .exe (not just checks it
        # compiled) and confirms the agent responds on real Windows --
        # this is exactly the check that would have caught the
        # BaseHTTPMiddleware/ProactorEventLoop hang (api/middleware.py)
        # automatically: the build compiled fine and even ran fine on
        # every developer's Linux machine, but every request to it on
        # real Windows hung forever with no response. A build that
        # can't pass this never gets uploaded as an artifact for anyone
        # to test by hand.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dataDir = Join-Path $env:RUNNER_TEMP "sg-smoke-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $configPath = Join-Path $env:RUNNER_TEMP "sg-smoke-config.yaml"
          @"
          data:
            data_dir: $dataDir
          api:
            host: 127.0.0.1
            port: 8799
          monitoring:
            enabled: false
          "@ | Set-Content -Path $configPath

          $proc = Start-Process -FilePath "dist\SentinelGuard\SentinelGuard.exe" `
            -ArgumentList "--config `"$configPath`" --serve" `
            -PassThru -WindowStyle Hidden

          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8799/api/v1/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if ($proc -and -not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }

          $logFile = Join-Path $dataDir "logs\sentinelguard.log"
          if (-not $healthy) {
            Write-Host "::error::Packaged SentinelGuard.exe never responded on /api/v1/health -- the build is broken even though it compiled."
            if (Test-Path $logFile) {
              Write-Host "----- sentinelguard.log -----"
              Get-Content $logFile
            } else {
              Write-Host "No log file was created at $logFile -- the executable may not have started at all."
            }
            exit 1
          }

          Write-Host "Packaged executable responded successfully on /api/v1/health."

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\sentinelguard.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-Setup-${{ steps.version.outputs.version }}
          path: installer/output/*.exe
